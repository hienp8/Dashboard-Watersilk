<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1020;--s1:#111a2e;--s2:#17223a;--s3:#1e2b47;--line:#25324f;--ink:#e9eefb;--mut:#9aa8c7;--brand:#2dd4bf;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
--c1:#38bdf8;--c2:#f59e0b;--c3:#34d399;--c4:#f472b6;--c5:#a78bfa;--c6:#fb7185;--c7:#22d3ee;--c8:#facc15;--r:12px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}
header{max-width:1200px;margin:auto;padding:18px 18px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.1px}header p{margin:0;color:var(--mut);font-size:12px}
nav{position:sticky;top:0;z-index:10;background:rgba(10,16,32,.92);backdrop-filter:blur(8px);display:flex;gap:4px;overflow-x:auto;max-width:1200px;margin:10px auto 0;padding:6px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav button{background:none;border:0;border-radius:8px;color:var(--mut);padding:8px 13px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--s1);color:var(--ink)}nav button.on{background:var(--s3);color:var(--brand)}nav button:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
main{max-width:1200px;margin:auto;padding:16px 18px 48px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}h3{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px}
.sec{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.8px;margin:22px 0 10px}
.card,.bx{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;max-width:100%}.bx{margin-bottom:14px}
.card .big{font-size:26px;font-weight:700;line-height:1.2}.card small{font-size:12px;font-weight:500;color:var(--mut)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}.k>*{min-width:0}
.kc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:3px solid var(--kc,var(--brand))}.kc span{font-size:12px;color:var(--mut)}.kc b{display:block;font-size:24px;font-weight:700;line-height:1.25}
.dl{font-size:12px;color:var(--mut);margin-top:4px}.n{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;margin-bottom:14px}.g2>*,.g3>*{min-width:0}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}.fl label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.4px}
select,input[type=file]{font:inherit;font-size:13px;padding:7px 10px;background:var(--s2);color:var(--ink);border:1px solid var(--line);border-radius:8px;text-transform:none;letter-spacing:0}
.btn{font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:var(--ink);cursor:pointer}.btn.p{background:var(--brand);border-color:var(--brand);color:#06231f}.btn:hover{filter:brightness(1.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;cursor:pointer;background:var(--s2);font-size:12.5px;color:var(--mut)}.chip.on{color:var(--ink);border-color:var(--cc);background:var(--s3)}.chip i{width:9px;height:9px;border-radius:50%;background:var(--cc)}.chip input{display:none}
.tw{overflow-x:auto;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600;background:var(--s2);position:sticky;top:0}td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}tbody tr:hover td{background:rgba(255,255,255,.03)}tr.tot td{font-weight:700;background:var(--s2);border-top:2px solid var(--line)}
.r{display:grid;grid-template-columns:140px 1fr 160px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}.br{height:10px;background:var(--s3);border-radius:99px;overflow:hidden}.br i{display:block;height:100%;border-radius:99px;background:var(--c1)}.r em{font-style:normal;text-align:right;color:var(--ink)}
.pb{height:8px;background:var(--s3);border-radius:99px;overflow:hidden;margin:5px 0 3px}.pb i{display:block;height:100%;border-radius:99px;background:var(--c3)}.mt{margin-top:10px}.mr{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}.mr b{color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.lg{font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.al{border:1px solid rgba(251,191,36,.5);background:rgba(251,191,36,.08);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12.5px}.al ul{margin:6px 0 0;padding-left:18px}
svg text{font-family:inherit}
@media (max-width:700px){body{font-size:13.5px}header,main{padding-left:12px;padding-right:12px}h1{font-size:17px}nav{padding:6px 8px}.k{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kc b{font-size:20px}.card .big{font-size:23px}.r{grid-template-columns:1fr auto;row-gap:4px}.r>span{grid-column:1;grid-row:1}.r>em{grid-column:2;grid-row:1}.r>div{grid-column:1/-1;grid-row:2}.fl select{max-width:44vw}.bx,.card{padding:12px}th,td{padding:6px 7px}}
</style></head><body>
<header><div class="logo">W</div><div><h1>Watersilk · Cuộn lớn · Gỗ dán</h1><p id="st">Đang tải dữ liệu…</p></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
let D={sales:[],xnt:[],tt:[],plan:[],sx:[],dt:[],comp:[],log:[],prices:{}},WK=[],CT=[],CB=[],T=0,S={y:0,m:0,m2:0,r:'',n:'',g:'',mt:'cl',sm:0,sp:'cl',w:0,s:'',nm:'imp',it:'cl',ys:null,pr:'tp',sec:'',tax:0,area:'',item:'',bs:0,cb:''};
const $=s=>document.querySelector(s),uniq=a=>[...new Set(a)],sum=(a,i)=>a.reduce((s,r)=>s+(r[i]||0),0),B=1e9;
const f=(n,d=1)=>n==null||isNaN(n)?'–':n.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
const PAL=['#38bdf8','#f59e0b','#34d399','#f472b6','#a78bfa','#fb7185','#22d3ee','#facc15'],MN=['Cả năm',...Array.from({length:12},(_,i)=>'Tháng '+(i+1))];
const NAME={cl:'Giấy tissue cuộn lớn',tp:'Giấy tissue thành phẩm',go:'Gỗ dán',ku:'Khăn ướt WS',pm:'KƯ PapaMama'},UNIT={cl:'tấn',tp:'tấn',go:'m³',ku:'cái',pm:'gói'};
/* ---------- thành phần giao diện ---------- */
const sel=(k,lb,opts,cb)=>`<label>${lb}<select onchange="S['${k}']=isNaN(this.value)||this.value===''?this.value:+this.value;${cb||''}draw()">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return `<option value="${v}" ${S[k]==v?'selected':''}>${t}</option>`}).join('')}</select></label>`;
const tbl=(h,rows,tot)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr${tot&&i==rows.length-1?' class="tot"':''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const bar=(l,v,mx,t,c)=>`<div class="r"><span>${l}</span><div class="br"><i style="width:${mx?Math.max(0,Math.min(100,v/mx*100)):0}%;${c?'background:'+c:''}"></i></div><em>${t}</em></div>`;
const b2=(l,a,b,mx,t)=>`<div class="r"><span>${l}</span><div><div class="br"><i style="width:${mx?Math.min(100,a/mx*100):0}%"></i></div><div class="br" style="margin-top:4px"><i style="width:${mx?Math.min(100,b/mx*100):0}%;background:var(--c2)"></i></div></div><em>${t}</em></div>`;
const dlt=(a,b)=>a==null||!b?'<span>–</span>':`<span class="${a>=b?'ok':'bad'}">${a>=b?'▲':'▼'} ${f(Math.abs(a/b-1)*100,1)}%</span>`;
const kc=(l,v,sub,col)=>`<div class="kc" style="--kc:${col||'var(--brand)'}"><span>${l}</span><b>${v}</b><div class="dl">${sub||''}</div></div>`;
const meter=(l,a,p,txt)=>{const v=p?a/p:null;return `<div class="mt"><div class="mr"><span>${l}</span><b class="${v==null?'':v>=1?'ok':v<.8?'bad':''}">${v==null?'–':f(v*100,0)+'%'}</b></div><div class="pb"><i style="width:${Math.min(100,(v||0)*100)}%;background:${v==null?'var(--s3)':v>=1?'var(--ok)':v<.8?'var(--c6)':'var(--c2)'}"></i></div><div class="n">${p?txt:'chưa có kế hoạch'}</div></div>`};
function line(sr,labels,w=720,h=250){const mob=innerWidth<700;if(mob){w=380;h=Math.min(h,250)}const fs=mob?11:11,L=42,Bt=24,n=labels.length,mx=Math.max(1,...sr.flatMap(s=>s.v.filter(x=>x!=null)))*1.1,X=i=>n>1?L+i*(w-L-10)/(n-1):L+(w-L-10)/2,Y=v=>h-Bt-v/mx*(h-Bt-10),st=Math.ceil(n/(mob?6:14));
 let o=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;for(let t=0;t<=4;t++){const v=mx*t/4,y=Y(v);o+=`<line x1="${L}" x2="${w-10}" y1="${y}" y2="${y}" stroke="#25324f"/><text x="${L-6}" y="${y+4}" font-size="${fs}" text-anchor="end" fill="#9aa8c7">${f(v,v<10?1:0)}</text>`}
 labels.forEach((l,i)=>{if(i%st==0||i==n-1)o+=`<text x="${X(i)}" y="${h-6}" font-size="${fs}" text-anchor="middle" fill="#9aa8c7">${l}</text>`});
 sr.forEach(s=>{const pt=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]),ps=pt.filter(x=>x);if(!ps.length)return;o+=`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w||2.4}" stroke-linejoin="round" stroke-linecap="round" ${s.d?'stroke-dasharray="6 5"':''} points="${ps.map(x=>x.join(',')).join(' ')}"/>`;pt.forEach((x,i)=>{if(x)o+=`<circle cx="${x[0]}" cy="${x[1]}" r="${s.w>3?4:3}" fill="#111a2e" stroke="${s.c}" stroke-width="2"><title>${s.n} ${labels[i]}: ${f(s.v[i],1)}</title></circle>`})});
 return o+'</svg><div class="lg">'+sr.map(s=>`<span><i style="background:${s.c}${s.d?';opacity:.6':''}"></i>${s.n}</span>`).join('')+'</div>'}
/* ---------- dữ liệu ---------- */
const AB=(y,m)=>y*12+m-1,years=()=>uniq([...D.xnt,...D.sales,...D.tt,...D.sx,...D.dt].map(r=>r[0])).filter(y=>y).sort((a,b)=>b-a);
function TT(){const m={};D.tt.forEach(r=>m[r[0]+'|'+r[1]]={y:r[0],m:r[1],cl:r[2],tp:r[3],go:r[4]});
 D.sx.forEach(r=>{if(!['cl','tp','go'].includes(r[2])||r[8]==null)return;const id=r[0]+'|'+r[1],o=m[id]=m[id]||{y:r[0],m:r[1]};o[r[2]]=r[8];o.src='sx'});
 const w=WK[WK.length-1];if(w&&w.month){const id=w.y+'|'+w.month;if(!m[id]||m[id].src!='sx'){const o=m[id]=m[id]||{y:w.y,m:w.month};o.partial=w.w;[['cl',1000],['tp',1000],['go',1]].forEach(([k,d])=>{const p=w.prods[k];if(p&&p.thang!=null)o[k]=p.thang/d})}}
 return Object.values(m).sort((a,b)=>a.y*100+a.m-b.y*100-b.m)}
const srcRows=k=>k=='dtv'?D.dt.map(r=>[r[0],r[1],r[2]]):TT().map(r=>[r.y,r.m,r[k]]);
const lastOf=(k,y)=>Math.max(0,...srcRows(k).filter(r=>r[0]==y&&r[2]!=null).map(r=>r[1]));
function PER(k){const a=S.m||1,b=Math.max(a,S.m2||lastOf(k,S.y)||12),n=b-a+1,mk=sh=>{const s=new Set();for(let m=a;m<=b;m++)s.add(AB(S.y,m)+sh);return s};return{a,b,n,c:mk(0),y:mk(-12),p:mk(-n)}}
function agg(k,s){const v=srcRows(k).filter(r=>s.has(AB(r[0],r[1]))&&r[2]!=null);return v.length?sum(v,2):null}
const VT=()=>sel('y','Năm',years().map(y=>[y,y]))+sel('m','Từ tháng',MN.map((t,i)=>[i,i?t:'Đầu năm']))+sel('m2','Đến tháng',MN.map((t,i)=>[i,i?t:'Tháng mới nhất']));
const inR=r=>r[0]==S.y&&((!S.m&&!S.m2)||(r[1]>=(S.m||1)&&r[1]<=(S.m2||12)));
const dm=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'',lab=w=>`Tuần ${w.w} (${dm(w.from)}–${dm(w.to)})`;
/* ---------- 1. Tổng quan ---------- */
function tab0(){const pd=PER('dtv'),tts=TT(),pn=tts.find(x=>x.y==S.y&&x.partial);
 let h=`<div class="fl">${VT()}</div>`;
 h+=`<div class="sec">Doanh thu</div>`;const cd=agg('dtv',pd.c),dk=D.dt.filter(r=>pd.c.has(AB(r[0],r[1])));
 h+=`<div class="k">${kc('Doanh thu T'+pd.a+'–T'+pd.b,f(cd,2)+' <small>tỷ</small>','Kỳ trước '+dlt(cd,agg('dtv',pd.p))+' · Cùng kỳ '+dlt(cd,agg('dtv',pd.y)),'var(--c1)')}<div class="kc" style="--kc:var(--c3)"><span>Hoàn thành kế hoạch doanh thu</span>${meter('Đạt so với kế hoạch',sum(dk,2),sum(dk,3),f(sum(dk,2),1)+' / '+f(sum(dk,3),1)+' tỷ')}</div></div>`;
 const lb=Array.from({length:12},(_,i)=>'T'+(i+1)),dm_=(y,i)=>Array.from({length:12},(_,m)=>{const r=D.dt.find(r=>r[0]==y&&r[1]==m+1);return r?r[i]:null});
 h+=`<div class="bx"><h2>Doanh thu theo tháng, ${S.y} (tỷ đồng)</h2>${line([{n:'Thực hiện',c:PAL[0],w:3.2,v:dm_(S.y,2)},{n:'Kế hoạch',c:PAL[1],d:1,v:dm_(S.y,3)}],lb)}</div>`;
 h+=`<div class="sec">Tiêu thụ các loại sản phẩm</div><div class="g3">${[['cl','var(--c1)'],['tp','var(--c3)'],['go','var(--c2)']].map(([k,c])=>{const P=PER(k),cur=agg(k,P.c),rows=D.sx.filter(r=>r[2]==k&&P.c.has(AB(r[0],r[1]))),a=rows.reduce((s,r)=>s+(r[8]||0),0),p=rows.reduce((s,r)=>s+(r[9]||0),0),lm=Math.max(0,...D.sx.filter(r=>r[2]==k&&r[0]==S.y&&r[1]<=P.b).map(r=>r[1])),lr=D.sx.find(r=>r[2]==k&&r[0]==S.y&&r[1]==lm);
  return `<div class="card" style="border-top:3px solid ${c}"><h3>${NAME[k]} · T${P.a}–T${P.b}</h3><div class="big">${f(cur,0)} <small>${UNIT[k]}</small></div><div class="dl">Cùng kỳ ${dlt(cur,agg(k,P.y))} · Kỳ trước ${dlt(cur,agg(k,P.p))}</div>${meter('Kế hoạch tháng (các tháng có KH)',a,p,f(a,0)+' / '+f(p,0)+' '+UNIT[k])}${lr?meter('Kế hoạch năm',lr[10],lr[11],f(lr[10],0)+' / '+f(lr[11],0)+' '+UNIT[k]+' (đến T'+lm+')')+`<div class="n" style="margin-top:8px">Tồn cuối T${lm}: <b style="color:var(--ink)">${f(lr[12],0)} ${UNIT[k]}</b> · ${lr[8]?f(lr[12]/lr[8],1):'–'} tháng bán</div>`:''}</div>`}).join('')}</div>`;
 if(pn)h+=`<div class="al">Tháng ${pn.m}/${pn.y} mới có số liệu đến <b>tuần ${pn.partial}</b> (chưa đủ tháng), nên số tiêu thụ tháng này thấp hơn thực tế cả tháng. Số đủ tháng sẽ thay thế khi có báo cáo SX–TT tháng.</div>`;
 const k=S.mt,ms={dtv:'Doanh thu (tỷ)',cl:'Cuộn lớn (tấn)',tp:'Thành phẩm (tấn)',go:'Gỗ dán (m³)'},sr=(y,c,d)=>({n:y,c,d,v:Array.from({length:12},(_,i)=>agg(k,new Set([AB(y,i+1)])))});
 h+=`<div class="bx"><div class="fl" style="margin:0 0 6px;justify-content:space-between"><h2>Xu hướng so với năm trước</h2>${sel('mt','',Object.entries(ms))}</div>${line([sr(S.y-1,PAL[1],1),sr(S.y,PAL[0],0)],lb)}</div>`;
 const w=WK[WK.length-1];if(w)h+=`<div class="bx"><h2>Cập nhật mới nhất theo tuần: ${lab(w)}/${w.y}</h2>${tbl(['Sản phẩm','Tiêu thụ trong kỳ','Lũy kế tháng '+w.month,'% kế hoạch tháng'],['cl','tp','go'].filter(k=>w.prods[k]).map(k=>{const p=w.prods[k],d=k=='go'?1:1000,c=p.pct!=null?p.pct:p.kh?p.thang/p.kh*100:null;return [NAME[k],f(p.ky/d,1)+' '+UNIT[k],f(p.thang/d,1)+' '+UNIT[k],c==null?'–':f(c,1)+'%']}))}</div>`;
 return h}
/* ---------- 2. Sản xuất và tồn kho ---------- */
function tab1(){const ys=uniq(D.sx.map(r=>r[0])).sort((a,b)=>b-a);if(!ys.length)return '<p class="n">Chưa có dữ liệu sản xuất và tồn kho.</p>';
 const y=ys.includes(S.y)?S.y:ys[0],ms=uniq(D.sx.filter(r=>r[0]==y).map(r=>r[1])).sort((a,b)=>a-b);if(!ms.includes(S.sm))S.sm=ms[ms.length-1];
 const rows=D.sx.filter(r=>r[0]==y&&r[1]==S.sm),pc=(a,b)=>b?`<span class="${a/b<.8?'bad':a/b>=1?'ok':''}">${f(a/b*100,0)}%</span>`:'–',n0=v=>v==null?'–':f(v,0);
 let h=`<div class="fl">${sel('y','Năm',ys.map(q=>[q,q]))}${sel('sm','Tháng',ms.map(m=>[m,'Tháng '+m]))}${sel('sp','Sản phẩm (biểu đồ)',uniq(D.sx.map(r=>r[2])).map(c=>[c,NAME[c]||c]))}</div><div class="sec">Báo cáo tháng (BC SX TT)</div>`;

 h+=`<div class="bx"><h2>Bảng số liệu theo tháng</h2>${tbl(['Tháng',...rv,...(pb?[pa+' so với '+pb]:[])],[...M.map(m=>['T'+m,...rv.map(y=>f(g(y,m))+(pt(y,m)?'*':'')),...(pb?[g(pa,m)&&g(pb,m)?dlt(g(pa,m),g(pb,m)):'–']:[])]),['Cộng T1–T'+L,...rv.map(y=>f(tot(y))),...(pb?[dlt(tot(pa),tot(pb))]:[])]],true)}</div>`;return h}
function tg(y){const i=S.ys.indexOf(y);i>=0?S.ys.splice(i,1):S.ys.push(y);draw()}
/* ---------- 6. Bảng giá ---------- */
function tab5(){const P=D.prices||{};let h=`<div class="fl">${sel('pr','Nội dung',[['tp','Thành phẩm (Watersilk, Comfy)'],['jumbo','Giấy cuộn lớn'],['go','Gỗ dán chịu nước'],['cb','Lệch giá CTBH']])}`;
 if(S.pr=='tp'){if(!P.tp)return h+'</div><p class="n">Chưa có bảng giá.</p>';const sc=uniq(P.tp.map(r=>r[0]));h+=sel('sec','Nhóm',[['','Tất cả'],...sc])+sel('tax','Giá',[[0,'Chưa thuế GTGT'],[1,'Có thuế GTGT 8%']])+`</div><div class="bx"><h2>Bảng giá thành phẩm cho NPP và đội bán hàng (đồng)</h2>${tbl(['Sản phẩm','Mã','ĐVT',...P.tp_cols],P.tp.filter(r=>!S.sec||r[0]==S.sec).map(r=>[r[1],r[2],r[3],...[0,1,2,3].map(k=>f(r[4+2*k+(+S.tax)],0))]))}<p class="n">${P.tp_head||''}</p></div>`}
 else if(S.pr=='jumbo'&&P.jumbo){const j=P.jumbo;h+=`</div><div class="bx"><h2>${j.qd}</h2>${tbl(['Sản phẩm','Chưa thuế (đ/tấn)','Có thuế (đ/tấn)'],j.rows.map(r=>[r[0],f(r[1],0),f(r[2],0)]))}<ul>${j.notes.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
 else if(S.pr=='go'&&P.go){const j=P.go;h+=`</div><div class="bx"><h2>${j.qd}</h2>${tbl(['Chủng loại','Quy cách','Số tấm/m³','Đ/tấm','Đ/m²','Đ/m³'],j.rows.map(r=>[r[0],r[1],r[2],f(r[3],0),f(r[4],0),f(r[5],0)]))}<ul>${j.notes.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
 else if(S.pr=='cb'){if(!CB.length)return h+'</div><p class="n">Chưa có bảng lệch giá CTBH.</p>';if(!CB.find(v=>v.id==S.cb))S.cb=CB[CB.length-1].id;const v=CB.find(x=>x.id==S.cb),p0=x=>x==null?'–':f(x*100,0)+'%',g0=x=>x==null?'–':f(x,0);
  h+=sel('cb','Bản phân tích',CB.slice().reverse().map(x=>[x.id,x.id.replace('-','/')]))+`</div><div class="bx"><div><b>Trước:</b> ${v.cu||'–'}</div><div><b>Mới:</b> ${v.moi||'–'}</div><p class="n">Đơn vị đồng. Giá cuối NPP là giá NPP thực trả sau các khoản chiết khấu.</p></div><div class="bx"><h2>Bảng so sánh giá</h2>${tbl(['STT','Sản phẩm','Giá trước VAT','CK giá','Giá sau VAT','CK quy chế','CK bán hàng','Giá cuối NPP (trước)','Giá sau VAT (mới)','CKHT','Giá cuối NPP (mới)','Lệch'],v.items.map(x=>{const c=x.cuoi_cu&&x.cuoi_moi?x.cuoi_moi/x.cuoi_cu-1:null;return [x.stt,x.sp,g0(x.gia_truoc_vat),p0(x.ck_gia),g0(x.gia_sau_vat),p0(x.ck_quy_che),p0(x.ck_ban_hang),'<b>'+g0(x.cuoi_cu)+'</b>',g0(x.sau_vat_moi),p0(x.ckht),'<b>'+g0(x.cuoi_moi)+'</b>',`<b class="${c>0?'bad':'ok'}">${c==null?'–':(c>0?'+':'')+f(c*100,1)+'%'}</b>`]}))}</div>`;
  const mx=Math.max(...v.items.map(x=>Math.max(x.cuoi_cu||0,x.cuoi_moi||0)),1);h+=`<div class="bx"><h2>Giá cuối NPP: trước và mới (đồng)</h2>${v.items.map(x=>b2(x.sp,x.cuoi_cu||0,x.cuoi_moi||0,mx,g0(x.cuoi_cu)+' → '+g0(x.cuoi_moi))).join('')}<div class="lg"><span><i style="background:var(--c1)"></i>Trước</span><span><i style="background:var(--c2)"></i>Mới</span></div></div>`}
 else h+='</div><p class="n">Chưa có dữ liệu.</p>';return h}
/* ---------- 7. Giá đối thủ ---------- */
function tab6(){const cs=D.comp;if(!cs.length)return '<p class="n">Chưa có dữ liệu giá đối thủ.</p>';const ar=uniq(cs.map(c=>c[2])).sort();if(!ar.includes(S.area))S.area=ar[0];const it=uniq(cs.filter(c=>c[2]==S.area).map(c=>c[3]));if(!it.includes(S.item))S.item=it[0];
 const pe=uniq(cs.filter(c=>c[2]==S.area).map(c=>c[0]*100+c[1])).sort(),k=+S.bs?[6,8]:[5,7],cp=uniq(cs.map(c=>c[4])),find=(n,p)=>cs.find(c=>c[2]==S.area&&c[3]==S.item&&c[4]==n&&c[0]*100+c[1]==p);
 const rows=cp.map(n=>{const v=pe.map(p=>{const c=find(n,p);return c&&c[k[0]]!=null?c[k[0]]:'–'}),nu=pe.map(p=>{const c=find(n,p);return c?c[k[1]]:null}).filter(x=>x!=null);return [n=='Sông Đuống'?'<b>Sông Đuống (ta)</b>':n,...v,nu.length>1?dlt(nu[nu.length-1],nu[0]):'–']});
 const sr=cp.map((n,i)=>({n,c:PAL[i%8],w:n=='Sông Đuống'?3.4:2,v:pe.map(p=>{const c=find(n,p);return c?c[k[1]]:null})}));
 return `<div class="fl">${sel('area','Khu vực',ar,"S.item='';")}${sel('item','Sản phẩm',it)}${sel('bs','Loại giá',[[0,'Đến cửa hàng'],[1,'Cho người tiêu dùng']])}</div><div class="bx"><h2>${S.item} – ${S.area} (nghìn đồng)</h2>${line(sr,pe.map(p=>'T'+(p%100)+'/'+String(Math.floor(p/100)).slice(2)),720,230)}</div><div class="bx"><h2>Bảng giá theo kỳ</h2>${tbl(['Đối thủ',...pe.map(p=>'T'+(p%100)+'/'+Math.floor(p/100)),'Thay đổi'],rows)}</div>`}
/* ---------- 8. Cập nhật dữ liệu ---------- */
function tab7(){const lg=D.log.slice().sort((a,b)=>b[0].localeCompare(a[0])).slice(0,100),last=lg[0];
 const SRC=[['BC SX TT Tháng NN năm 2026 PTT (.xlsx)','Hằng tháng','Tổng quan · Sản xuất & tồn kho · Sản lượng tiêu thụ'],['BC tuần NN năm 2026 PTT (.xls/.xlsx)','Hằng tuần','Sản xuất & tồn kho · Tổng quan (số tháng đang chạy)'],['BC TIÊU THỤ & XNT TNN (.xls)','Hằng tuần, bản cuối vào cuối tháng','Nhà phân phối'],['BC BHTP theo ĐT Tháng NN.2026 (.xls)','Hằng tháng','Bán hàng thành phẩm'],['LỆCH GIÁ CTBH (.xlsx)','Khi có chương trình mới','Bảng giá › Lệch giá CTBH'],['So sánh giá đối thủ (.xls)','Hằng tháng','Giá đối thủ']];
 return `<div class="bx"><h2>Nguồn dữ liệu và chu kỳ cập nhật</h2>${tbl(['File báo cáo','Tần suất','Hiển thị ở tab'],SRC)}<p class="n">Cách cập nhật: bỏ file vào thư mục Google Drive đã kết nối, gửi email từ địa chỉ được duyệt, hoặc đặt vào thư mục inbox/ trên GitHub. Hệ thống tự nhận dạng loại file, cập nhật số liệu và ghi lịch sử bên dưới (thường sau 15–20 phút).</p></div><div class="bx"><h2>Lịch sử cập nhật</h2>${last?`<p class="n">Lần gần nhất: ${new Date(last[0]).toLocaleString('vi-VN')} · ${last[1]} · ${last[2]}</p>`:''}${lg.length?tbl(['Thời gian','File','Nguồn','Người cập nhật','Loại dữ liệu','Kết quả'],lg.map(r=>[new Date(r[0]).toLocaleString('vi-VN'),r[1],r[2],r[3],r[4],r[5]])):'<p class="n">Chưa có lần cập nhật nào được ghi lại.</p>'}</div>`}

const TABS=['Tổng quan','Sản xuất & tồn kho','Nhà phân phối','Bán hàng thành phẩm','Sản lượng tiêu thụ','Bảng giá','Giá đối thủ','Cập nhật dữ liệu'],FN=[tab0,tab1,tab2,tab3,tab4,tab5,tab6,tab7];

 const ys=years();S.y=ys[0]||new Date().getFullYear();S.sm=0;
 $('#st').textContent=d?`Dữ liệu đến ${D.dt.length?'T'+D.dt[D.dt.length-1][1]+'/'+D.dt[D.dt.length-1][0]:'–'}${WK.length?' · báo cáo tuần '+WK[WK.length-1].w:''}${D.log.length?' · cập nhật '+new Date(D.log.slice().sort((a,b)=>b[0].localeCompare(a[0]))[0][0]).toLocaleDateString('vi-VN'):''}`:'Không tải được data/data.json (mở qua GitHub Pages hoặc máy chủ web).';draw()})();
